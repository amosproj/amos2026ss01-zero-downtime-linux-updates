name: "Application Images"

on:
  push:
    branches: ["**"]
    tags: ["**"]
    paths: ["applications/hello-world/**"]
  pull_request:
    branches: [main]
    paths: ["applications/hello-world/**"]
  workflow_dispatch:


env:
  REGISTRY: ghcr.io
  APP: hello-world

jobs:
  build:
    name: Build hello-world
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read application version
        id: version
        run: |
          VERSION=$(cat "applications/${{ env.APP }}/VERSION" | tr -d '[:space:]')
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ env.APP }}
          tags: |
            type=raw,value=${{ steps.version.outputs.app_version }}
            type=sha,prefix=commit-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: applications/${{ env.APP }}
          file: applications/${{ env.APP }}/Containerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha,scope=${{ env.APP }}
          cache-to: type=gha,mode=max,scope=${{ env.APP }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ vars.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ vars.COSIGN_PASSWORD }}
        run: |
          cosign sign \
            --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --recursive \
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ env.APP }}@${{ steps.build.outputs.digest }}
