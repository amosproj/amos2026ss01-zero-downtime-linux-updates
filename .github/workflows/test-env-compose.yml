version: '3.8'

services:
  postgres-container:
    # Using standard Alpine Postgres for a lightweight test environment
    image: postgres:15-alpine
    environment:
      # These MUST match the defaults in api-mock-server/src/config.rs
      POSTGRES_USER: app
      POSTGRES_PASSWORD: 4M0S
      POSTGRES_DB: amos
    ports:
      # Exposed on localhost so the API Mock Server (cargo run) can connect
      - "127.0.0.1:5432:5432"
    volumes:
      # Persist database data across container restarts
      - "postgres_data:/var/lib/postgresql/data:rw"

volumes:
  postgres_data: