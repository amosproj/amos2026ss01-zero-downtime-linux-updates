name: "Edge Disk Image"

on:
  push:
    tags: ["**"]
  workflow_run:
    workflows: ["Orchestrator Container Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "tag of image to build the disk from (image built by container-orchestrator.yml)"
        required: false
        default: "latest"
        type: string

jobs:
  filter:
    name: Check if build is needed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          # Tags and manual runs always build.
          if [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For workflow_run (branch pushes): build on main or any branch whose
          # name contains a keyword as a whole segment (delimited by - or /).
          # This prevents e.g. "feat-device-logging" from matching "dev".
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == "main" ]] || \
             [[ "$BRANCH" =~ (^|[-/])(ci|dev|test|release|iso)([-/]|$) ]]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build-disk:
    name: Build disk image (${{ matrix.arch }})
    needs: filter
    if: needs.filter.outputs.should-build == 'true'
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # container-orchestrator.yml publishes a multi-arch manifest, so each
        # runner pulls the matching arch of the -system image automatically.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      # Use commit-<sha> so the disk is built from the exact container image that
      # was produced by the same commit, not whatever "latest" resolves to.
      - name: Resolve bootc image reference
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_ref }}" ]; then
            TAG="${{ inputs.image_ref }}"
            SAFE_REF="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="commit-${GITHUB_SHA:0:7}"
            SAFE_REF="${GITHUB_REF_NAME//\//-}"
          else
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="commit-${HEAD_SHA:0:7}"
            SAFE_REF="${{ github.event.workflow_run.head_branch }}"
          fi
          SAFE_REF="${SAFE_REF//\//-}"
          echo "IMAGE_REF=ghcr.io/${{ github.repository }}-system:${TAG}" >> "$GITHUB_ENV"
          echo "SAFE_REF=${SAFE_REF}" >> "$GITHUB_ENV"
          echo "Using bootc image: ghcr.io/${{ github.repository }}-system:${TAG}"

      - name: Log in to GHCR (root podman, for pulling the bootc image)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tag builds start concurrently with the container build; retry until the
      # image is published (container build takes ~10-15 min; allow up to 20 min).
      - name: Pull the bootc image into root storage
        run: |
          for i in $(seq 1 20); do
            sudo podman pull "${IMAGE_REF}" && break
            [ "$i" -eq 20 ] && { echo "Timed out waiting for image"; exit 1; }
            echo "Image not yet available, retrying in 60s (attempt $i/20)..."
            sleep 60
          done

      - name: Assert prod policy (no dev markers in image)
        run: |
          set -euo pipefail
          cid=$(sudo podman create "${IMAGE_REF}")
          trap "sudo podman rm -f $cid >/dev/null" EXIT
          if sudo podman cp "$cid:/etc/amos-dev-image" /tmp/marker 2>/dev/null; then
            echo "::error::dev marker present in the disk image"; exit 1
          fi

      # image-builder-cli (the new builder) caches DNF metadata only when given
      # --rpmmd-cache (off by default); persist that /rpmmd dir across runs. qcow2
      # and raw share the same package set, so the second run reuses the first's.
      - name: Restore DNF cache
        uses: actions/cache/restore@v4
        with:
          path: rpmmd-cache
          key: ${{ runner.os }}-disk-rpmmd-${{ matrix.arch }}-${{ hashFiles('bootc/Containerfile') }}
          restore-keys: |
            ${{ runner.os }}-disk-rpmmd-${{ matrix.arch }}-

      - name: Build qcow2 image
        run: |
          mkdir -p "$PWD/output" "$PWD/rpmmd-cache"
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output":/output \
            -v "$PWD/rpmmd-cache":/rpmmd:Z \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
              --bootc-ref "${IMAGE_REF}" \
              --bootc-default-fs ext4 \
              --rpmmd-cache /rpmmd \
              --output-dir /output \
              qcow2

      - name: Build raw image
        run: |
          mkdir -p "$PWD/output" "$PWD/rpmmd-cache"
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output":/output \
            -v "$PWD/rpmmd-cache":/rpmmd:Z \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
              --bootc-ref "${IMAGE_REF}" \
              --bootc-default-fs ext4 \
              --rpmmd-cache /rpmmd \
              --output-dir /output \
              raw

      - name: Compress and rename artifacts
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" output
          mkdir -p dist
          xz -T0 -9 output/*.qcow2 output/*.raw
          mv output/*.qcow2.xz "dist/amos-edge-${SAFE_REF}-${{ matrix.arch }}.qcow2.xz"
          mv output/*.raw.xz   "dist/amos-edge-${SAFE_REF}-${{ matrix.arch }}.raw.xz"
          ls -lh dist/*.xz

      # Builder writes the cache as root; chown it back so actions/cache can read
      # it. Runs on failure too, to save a partial cache.
      - name: Fix DNF cache permissions
        if: always()
        run: sudo chown -R "$USER:$USER" rpmmd-cache 2>/dev/null || true
      - name: Save DNF cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rpmmd-cache
          key: ${{ runner.os }}-disk-rpmmd-${{ matrix.arch }}-${{ hashFiles('bootc/Containerfile') }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push disk image to GHCR via ORAS
        uses: oras-project/setup-oras@v1

      - name: Push artifacts
        run: |
          cd dist
          oras push \
            ghcr.io/${{ github.repository }}-disk:${SAFE_REF}-${{ matrix.arch }} \
            amos-edge-${SAFE_REF}-${{ matrix.arch }}.qcow2.xz \
            amos-edge-${SAFE_REF}-${{ matrix.arch }}.raw.xz

      #- name: Attach to GitHub Release
      #  if: startsWith(github.ref_name, 'test-setup-')
      #  uses: softprops/action-gh-release@v2.6.2
      #  with:
      #    files: dist/*.xz
      #    draft: true
      #    fail_on_unmatched_files: true
