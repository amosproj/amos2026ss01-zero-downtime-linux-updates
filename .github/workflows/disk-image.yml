name: "Edge Disk Image"

on:
  push:
    tags: ['sprint-*-release']
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build with (e.g. 39, 40, latest)'
        required: true
        default: 'latest'
        type: string

env:
  IMAGE_TAG: localhost/amos-edge:dev

jobs:
  build-disk:
    name: Build disk image (${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build the bootc OCI image
        run: |
          podman build \
            --build-arg FEDORA_VERSION=${{ inputs.fedora_version || 'latest' }} \
            -f rootc-build/Containerfile \
            -t ${IMAGE_TAG} .

      - name: Build qcow2 + raw with bootc-image-builder
        run: |
          mkdir -p dist
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/dist":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --type raw \
            "${IMAGE_TAG}"
          sudo chown -R "$USER:$USER" dist

      - name: Compress and rename artifacts
        run: |
          set -euo pipefail
          xz -T0 -9 dist/qcow2/disk.qcow2 dist/raw/disk.raw
          mv dist/qcow2/disk.qcow2.xz \
             "dist/amos-edge-${GITHUB_REF_NAME}-${{ matrix.arch }}.qcow2.xz"
          mv dist/raw/disk.raw.xz \
             "dist/amos-edge-${GITHUB_REF_NAME}-${{ matrix.arch }}.raw.xz"
          ls -lh dist/*.xz

      # If a compressed artifact still trips GitHub's 2 GB per-file release-asset
      # cap, push to GHCR via ORAS instead and point the Lima template's
      # `location:` at the resulting HTTPS blob URL (no per-asset cap on GHCR).
      # Keep this commented so the switch is mechanical when needed.
      #
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - name: Push disk image to GHCR via ORAS
      #   uses: oras-project/setup-oras@v1
      #   - run: |
      #       oras push \
      #         ghcr.io/${{ github.repository }}-disk:${GITHUB_REF_NAME}-${{ matrix.arch }} \
      #         dist/amos-edge-${GITHUB_REF_NAME}-${{ matrix.arch }}.raw.xz

      - name: Attach to GitHub Release
        if: startsWith(github.ref_name, 'sprint-') && contains(github.ref_name, '-release')
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: dist/*.xz
          draft: true
          fail_on_unmatched_files: true
