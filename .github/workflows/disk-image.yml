name: "Edge Disk Image"

on:
  push:
    tags: ["test-setup-*"]
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version to build with (e.g. 39, 40, latest)"
        required: true
        default: "latest"
        type: string

env:
  IMAGE_TAG: localhost/amos-edge:dev

jobs:
  build-disk:
    name: Build disk image (${{ matrix.arch }})
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build the bootc OCI image
        run: |
          podman build \
            --build-arg FEDORA_VERSION=${{ inputs.fedora_version || 'latest' }} \
            -f rootc-build/Containerfile \
            -t ${IMAGE_TAG} .
          podman save --format oci-archive -o /tmp/amos-edge.tar ${IMAGE_TAG}

      - name: Assert prod policy (no dev markers in image)
        run: |
          set -euo pipefail
          cid=$(podman create "${IMAGE_TAG}")
          trap "podman rm -f $cid >/dev/null" EXIT
          podman cp "$cid:/etc/containers/policy.json" /tmp/policy.json
          if grep -q insecureAcceptAnything /tmp/policy.json; then
            echo "::error::dev policy leaked into a CI build"; exit 1
          fi
          if podman cp "$cid:/etc/amos-dev-image" /tmp/marker 2>/dev/null; then
            echo "::error::dev marker present in CI build"; exit 1
          fi

      - name: Load the bootc image into root storage
        run: sudo podman load -i /tmp/amos-edge.tar

      - name: Build qcow2 image
        run: |
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
              --bootc-ref "${IMAGE_TAG}" \
              --bootc-default-fs ext4 \
              --output-dir /output \
              qcow2

      - name: Build raw image
        run: |
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
              --bootc-ref "${IMAGE_TAG}" \
              --bootc-default-fs ext4 \
              --output-dir /output \
              raw

      - name: Compress and rename artifacts
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" output
          mkdir -p dist
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          xz -T0 -9 output/*.qcow2 output/*.raw
          mv output/*.qcow2.xz "dist/amos-edge-${SAFE_REF}-${{ matrix.arch }}.qcow2.xz"
          mv output/*.raw.xz   "dist/amos-edge-${SAFE_REF}-${{ matrix.arch }}.raw.xz"
          ls -lh dist/*.xz

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push disk image to GHCR via ORAS
        uses: oras-project/setup-oras@v1

      - name: Push artifacts
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cd dist
          oras push \
            ghcr.io/${{ github.repository }}-disk:${SAFE_REF}-${{ matrix.arch }} \
            amos-edge-${SAFE_REF}-${{ matrix.arch }}.qcow2.xz \
            amos-edge-${SAFE_REF}-${{ matrix.arch }}.raw.xz

      #- name: Attach to GitHub Release
      #  if: startsWith(github.ref_name, 'test-setup-')
