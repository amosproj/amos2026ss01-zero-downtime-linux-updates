name: "Rust CI/CD"
on:
  push:
  pull_request:

jobs:
  # Check for compilation errors with cargo check
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Install tss2 headers / pkgconfig required during compilation (reused across jobs)
      - &install-deps
        name: Install tpm libs required for compilation
        run: |
          sudo apt update
          sudo apt install -y libtss2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Share one dependency cache across check/lints/test instead of three
          # separate ones, and keep it even when a job fails.
          cache-shared-key: rust-ci
          cache-on-failure: true
      - run: cargo check --all-targets --all-features

  # Check formatting with rustfmt and linting with clippy
  lints:
    name: Lints (fmt and clippy)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - *install-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-shared-key: rust-ci
          cache-on-failure: true
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
      - name: Clippy Check
        run: cargo clippy -- -D warnings

  test:
    name: cargo test
    needs: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - *install-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-ci
          cache-on-failure: true
      - run: cargo test --all-features

  # Release Build if a Tag is pushed
  release_build:
    name: Release Build
    # only run when a tag is pushed
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - *install-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Build Release Binaries
        run: >-
          cargo build --release --target x86_64-unknown-linux-gnu
          -p amos-api-mock-server
          -p amos-orchestrator

      - name: Stage Release Binaries
        run: |
          mkdir -p release-bin
          cp target/x86_64-unknown-linux-gnu/release/amos-api-mock-server release-bin/
          cp target/x86_64-unknown-linux-gnu/release/amos-orchestrator release-bin/

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.ref_name }}-binaries
          path: release-bin/*

      - name: Generate release notes
        if: startsWith(github.ref_name, 'sprint-') && contains(github.ref_name, '-release')
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref_name, 'sprint-') && contains(github.ref_name, '-release')
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: release-bin/*
          body_path: RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
