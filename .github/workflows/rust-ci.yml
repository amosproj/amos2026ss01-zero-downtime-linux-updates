name: "CI Pipeline"
on:
  push:
  pull_request:

jobs:

  # Check for compilation errors with cargo check
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --all-targets --all-features

  # Check formatting with rustfmt and linting with clippy
  lints:
    name: Lints (fmt and clippy)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
      - name: Clippy Check
        run: cargo clippy -- -D warnings
      
  test:
    name: cargo test
    needs: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --all-features

# Release Build if a Tag is pushed 
  release_build:
    name: Release Build
    # only run when a tag is pushed
    if: github.ref_type == 'tag'
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      
      - name: Upload Binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.ref_name }}-binary
          path: target/x86_64-unknown-linux-gnu/release/amos2026ss01-zero-downtime-linux-updates