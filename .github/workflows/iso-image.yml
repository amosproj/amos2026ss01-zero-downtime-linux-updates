name: "Installer ISO"

# Builds installer ISO for a real IPC.
# This action is independent of a pre-published bootc image.
#
# Triggers:
#   - Manual run (workflow_dispatch) — UI button or `gh workflow run`.
#   - Tag pushes
#
# Output:
#   - Workflow artifact `amos-edge-<ref>-amd64-iso` containing install.iso.
#     Download from the run page or with `gh run download <run-id>`.
#     Retention: 30 days.

on:
  push:
    branches: ["**"] # TODO: disable before merge to main
    tags: ["**"]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build installer ISO (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free up disk space
        # we will need a lot of disk space which is limited on
        # GitHub-hosted runners to something around 20-25 GB.
        # remove the preinstalled .NET / Android / Haskell
        # toolchains we don't need before starting.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build installer ISO
        # builds the bootc image into root podman storage and
        # runs bootc-image-builder to emit dist/bootiso/install.iso.
        # DEV_MODE defaults to false (prod). IMAGE name stays internal — it is
        # built/consumed locally, never pushed. Output is always install.iso;
        # the rename step below derives the ref-based artifact name.
        # TODO: embed a real published bootc ref so `bootc upgrade` works on HW.
        run: make iso-amd64

      - name: Rename ISO for download
        id: rename
        run: |
          set -euo pipefail
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          ISO_NAME="amos-edge-${SAFE_REF}-amd64"
          mv dist/bootiso/install.iso "dist/${ISO_NAME}.iso"
          ls -lh "dist/${ISO_NAME}.iso"
          echo "iso_name=${ISO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.iso_name }}
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 30
          # skip zipping
          archive: false
