name: "Orchestrator Container Image"

on:
  push:
    tags: ['**']
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build with (e.g. 39, 40, latest)'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-system

jobs:
  build-and-push:
    name: Build & Push Orchestrator Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to GHCR and to attach signatures

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR – only on main branch or tags, never on feature branches or PRs
      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags from the Git ref automatically:
      #   main branch  → latest + sha-<short>
      #   sprint tags  → sprint-03-release + sha-<short>
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
            type=raw,value=fedora-${{ inputs.fedora_version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rootc-build/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FEDORA_VERSION=${{ inputs.fedora_version || 'latest' }}
          # Cache layers in the GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with Cosign
        if: github.ref_type == 'tag'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

