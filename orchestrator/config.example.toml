# Orchestrator Configuration
# Copy this file to config.toml and adjust values for your environment.
# All keys can also be set via environment variables prefixed APP_
# (e.g. APP_CLOUD_URL). Environment variables take precedence over this file.
# The path to this file can be chosen with the --config flag or, if that is
# not given, the APP_CONFIG_FILE environment variable.

# Base URL of the Cloud API.
# Accepts http:// or https:// schema.
# Env: APP_CLOUD_URL
# Default: https://cloud.weber.de/v2
cloud_url = "https://your-cloud-api.example.com/v2"

# How often the Orchestrator polls the Cloud API, in seconds.
# Must be >= 1.
# Env: APP_POLL_INTERVAL_SECS
# Default: 5
poll_interval_secs = 60
