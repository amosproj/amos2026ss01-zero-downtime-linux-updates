[package]
name = "amos-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.22", features = ["toml"] }
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
anyhow = "1.0.102"
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"