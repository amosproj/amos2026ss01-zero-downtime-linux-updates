# Lima template for the edge IPC VM.
#
# Boots the bootc disk image in ./dist, produced by either `make image` (build
# locally) or `make pull-image` (download the prebuilt image from GHCR, for devs
# who don't build locally). See the images: block below.
#
# Quickstart (in the project root directory):
#   limactl start --name edge-ipc dev-env/lima/edge-ipc.yaml
#   limactl shell edge-ipc -- journalctl -u orchestrator.service -f
#
#
# for all .yaml options see:
# https://github.com/lima-vm/lima/blob/master/templates/default.yaml

# vmType: "vz" # https://lima-vm.io/docs/config/vmtype/
arch: "default"
cpus: 2
memory: "4GiB"
disk: "20GiB"

images:
  # Local entries, populated either by `make image` (build locally) or by
  # `make pull-image` (download the prebuilt image from GHCR — see below).
  # raw works under both vz and qemu.
  - location: "dist/qcow2/disk.qcow2"
    arch: "aarch64"

  - location: "dist/qcow2/disk.qcow2"
    arch: "x86_64"

# default lima mounts
mounts:
  - location: "~"
    writable: false
  - location: "/tmp/lima"
    writable: true

provision:
  ### Dev setup: make updating the orchestrator binary inside the VM easier
  # Redirect the orchestrator service's ExecStart to a writable path so we can
  # swap the binary on a live VM. Empty ExecStart= clears the unit's value
  # before setting the new one (systemd requires this).
  - mode: data
    path: /etc/systemd/system/orchestrator.service.d/10-dev.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/var/usrlocal/bin/amos-orchestrator --config /etc/amos/config.toml
  # Ensure the writable bin dir for hot-swapped dev binaries exists. The
  # systemd drop-in below points the orchestrator's ExecStart at this path so
  # `make dev-deploy` can swap the binary without rebuilding the OS image.
  - mode: boot
    script: |
      #!/bin/bash
      set -eux -o pipefail
      mkdir -p /var/usrlocal/bin
      # If a dev binary hasn't been deployed yet, fall back to the image's
      # /usr/libexec binary so the service still starts on first boot.
      if [ ! -x /var/usrlocal/bin/amos-orchestrator ]; then
        ln -sf /usr/libexec/amos-orchestrator /var/usrlocal/bin/amos-orchestrator
      fi
  # Reload the systemd daemon as a precaution, in case the drop-in for the
  # orchestrator service or eventual symlinking caused changes.
  - mode: system
    script: "systemctl daemon-reload"

  ### Config file setup
  # Write config file the orchestrator reads.
  # `file:` is resolved relative to this YAML.
  - mode: data
    path: /etc/amos/config.toml
    file: orchestrator-config.toml

  ### vTPM initialization
  # Initialize the vTPM - see dev-env/tpm.md for explanation of the commands.
  # If a persistent handle (aka. signing key) is detected, we are already initalized
  - mode: boot
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if [ -n "$( tpm2_getcap handles-persistent )" ]; then
        echo "TPM already initalized (persistent handle present)"
        exit 0
      fi

      cd /tmp
      tpm2_createprimary -C o -c primary.ctx
      tpm2_create -C primary.ctx -G rsa -u key.pub -r key.priv
      tpm2_load -C primary.ctx -u key.pub -r key.priv -c key.ctx
      tpm2_evictcontrol -C o -c key.ctx 0x81000000
      echo "TPM initalized successfully!"

  # ### Random fixes
  # # Prevent lima from installing random sh*t into the VM and therefore having
  # # failed cloud-init services because our bootc system is read-only.
  # # https://github.com/lima-vm/lima/blob/2a9cb9a4636b822057bff6abc6a138a0ec640550/templates/default.yaml#L222-L237
  # - mode: dependency
  #   skipDefaultDependencyResolution: true
  #   script: |
  #     echo "Skipping default dependency resolution"

  # /usr/local/bin is read-only, so let's point it to /var/usrlocal/bin instead.
  - mode: boot
    script: |
      #!/bin/bash
      set -eux -o pipefail
      mkdir -p /var/usrlocal/bin

  # also see `env:` below
  # Fall back to xterm-256color when the host terminal's terminfo entry
  # isn't shipped in the VM (e.g. xterm-ghostty, xterm-kitty). Without this,
  # `systemctl status` and other pager-using commands fail with
  # "terminal not fully functional".
  - mode: data
    path: /etc/profile.d/lima-term-fallback.sh
    permissions: "0755"
    content: |
      if [ -n "$TERM" ] && ! infocmp "$TERM" >/dev/null 2>&1; then
        export TERM=xterm-256color
      fi
  # TODO: Remove this when bootc file has been fixed to have the podman socket
  #       enabled there
  - mode: boot
    script: |
      systemctl enable podman.socket
      systemctl start podman.socket

# Extra environment variables that will be loaded into the VM at start up.
# These variables are consumed by internal init scripts, and also added
# to /etc/environment.
env:
  LIMA_CIDATA_GUEST_INSTALL_PREFIX: /var/usrlocal
  # AMOS: path to config file for orchestrator.
  APP_CONFIG_FILE: /etc/amos/config.toml

# Turn off containerd. https://lima-vm.io/docs/examples/containers/containerd/
containerd:
  system: false
  user: false
