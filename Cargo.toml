[workspace]
resolver = "3"
members = ["api-mock-server", "common", "orchestrator"]

[workspace.dependencies]
amos-api-mock-server = { path = "api-mock-server" }
amos-common = { path = "common" }
amos-orchestrator = { path = "orchestrator" }

anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.22", features = ["toml"] }
env_logger = "0.11.10"
log = "0.4.29"
sea-orm = { version = "2.0.0-rc", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json", "entity-registry"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.2", features = ["full"] }
